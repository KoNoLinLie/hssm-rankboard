<div id="rankContainer" style="width:100%;">
  <iframe id="rankFrame"
          src="https://dcnuvkn7y31w.aiforce.cloud/app/app_17b0wgd2xcj"
          scrolling="no"
          style="width:100%;border:0;display:block;min-height:600px;"></iframe>
</div>

<script>
  // ===== 配置：改成你的 Worker URL =====
  const PROXY_URL = 'https://rank-proxy.2302724260.workers.dev';

  const container = document.getElementById('rankContainer');
  const frame     = document.getElementById('rankFrame');
  let   loaded    = false;

  // 1) iframe 高度同步
  window.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'setHeight') {
      frame.style.height = event.data.height + 'px';
    }
  });

  if (frame) frame.addEventListener('load', function () { loaded = true; });

  // 2) 5 秒内没加载成功，触发降级
  setTimeout(function () {
    if (!loaded) fallback();
  }, 5000);

  // 3) 降级：通过 Worker 代理调飞书 API，原生 HTML 渲染
  function fallback() {
    container.innerHTML = '<div style="padding:24px;text-align:center;color:#888">排行榜加载中…</div>';

    fetch(PROXY_URL)
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(renderRank)
      .catch(function (e) {
        container.innerHTML = '<div style="padding:24px;text-align:center;color:#c33">排行榜加载失败：' + e.message + '</div>';
      });
  }

  function renderRank(data) {
    var items = (data && data.items) || [];
    if (!items.length) {
      container.innerHTML = '<div style="padding:24px;text-align:center;color:#999">暂无排行数据</div>';
      return;
    }

    var rows = items.map(function (it, i) {
      return ''
        + '<tr style="border-bottom:1px solid #eee;">'
        +   '<td style="padding:14px 10px;font-weight:700;color:#888;">' + (i + 1) + '</td>'
        +   '<td style="padding:14px 10px;">' + (it.playerName || '-') + '</td>'
        +   '<td style="padding:14px 10px;text-align:right;font-variant-numeric:tabular-nums;">' + it.totalScore.toFixed(4) + '</td>'
        +   '<td style="padding:14px 10px;text-align:right;color:#666;font-variant-numeric:tabular-nums;">' + it.totalDx + '</td>'
        + '</tr>';
    }).join('');

    container.innerHTML = ''
      + '<div style="font-family:\'Noto Sans SC\',\'Microsoft YaHei\',sans-serif;padding:24px;max-width:720px;margin:0 auto;">'
      +   '<h2 style="font-size:22px;font-weight:700;margin:0 0 16px;">"海师山盟"预选排行榜</h2>'
      +   '<table style="width:100%;border-collapse:collapse;background:#fff;">'
      +     '<thead>'
      +       '<tr style="background:#f5f5f5;font-size:13px;color:#666;">'
      +         '<th style="padding:10px;text-align:left;">#</th>'
      +         '<th style="padding:10px;text-align:left;">选手</th>'
      +         '<th style="padding:10px;text-align:right;">总分</th>'
      +         '<th style="padding:10px;text-align:right;">总 DX</th>'
      +       '</tr>'
      +     '</thead>'
      +     '<tbody>' + rows + '</tbody>'
      +   '</table>'
      +   '<div style="margin-top:12px;font-size:12px;color:#aaa;text-align:right;">'
      +     '数据更新于 ' + (data.updatedAt ? new Date(data.updatedAt).toLocaleString('zh-CN') : '-')
      +   '</div>'
      + '</div>';
  }
</script>
