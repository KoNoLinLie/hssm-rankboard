<div id="rankContainer" style="width:100%;"></div>

<script>
  // ===== 改成你的 Cloudflare Worker URL =====
  const PROXY_URL = 'https://rank-proxy.2302724260.workers.dev';
  const IFRAME_URL = 'https://dcnuvkn7y31w.aiforce.cloud/app/app_17b0wgd2xcj';

  const container = document.getElementById('rankContainer');
  let   rendered  = false;

  // 1) 先创建 iframe
  const frame = document.createElement('iframe');
  frame.src = IFRAME_URL;
  frame.scrolling = 'no';
  frame.style.cssText = 'width:100%;border:0;display:block;min-height:600px;';
  container.appendChild(frame);

  // 2) 监听 React 成功挂载的信号
  window.addEventListener('message', function (event) {
    if (event.data && event.data.type === 'setHeight') {
      rendered = true;
      clearTimeout(fallbackTimer);
      frame.style.height = event.data.height + 'px';
    }
  });

  // 3) 3 秒内没收到成功信号 → 彻底移除 iframe → 降级
  const fallbackTimer = setTimeout(function () {
    if (rendered) return;

    // 关键：彻底从 DOM 移除 iframe，不留任何引用
    if (frame.parentNode) frame.parentNode.removeChild(frame);
    // 清空容器
    container.innerHTML = '';

    fetchRankData();
  }, 3000);

  // 4) 通过 Worker 代理调飞书 API
  function fetchRankData() {
    container.innerHTML = '<div style="padding:40px;text-align:center;color:#888;">排行榜加载中…</div>';

    fetch(PROXY_URL, { method: 'GET', cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function (data) {
        var items = (data && data.items) || [];
        if (!items.length) {
          container.innerHTML = '<div style="padding:40px;text-align:center;color:#999;">暂无排行数据</div>';
          return;
        }
        items.sort(function (a, b) {
          if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
          return b.totalDx - a.totalDx;
        });
        renderRank(items, data.updatedAt);
      })
      .catch(function (e) {
        container.innerHTML =
          '<div style="padding:40px;text-align:center;color:#c33;">' +
            '排行榜加载失败：' + e.message +
          '</div>';
      });
  }

  function renderRank(items, updatedAt) {
    var rows = items.map(function (it, i) {
      var color = i === 0 ? '#f5a623' : i === 1 ? '#9b9b9b' : i === 2 ? '#cd7f32' : '#888';
      return ''
        + '<tr style="border-bottom:1px solid #eee;">'
        +   '<td style="padding:14px 10px;font-weight:700;color:' + color + ';">' + (i + 1) + '</td>'
        +   '<td style="padding:14px 10px;font-weight:500;">' + (it.playerName || '-') + '</td>'
        +   '<td style="padding:14px 10px;text-align:right;font-variant-numeric:tabular-nums;">' + it.totalScore.toFixed(4) + '</td>'
        +   '<td style="padding:14px 10px;text-align:right;color:#666;font-variant-numeric:tabular-nums;">' + it.totalDx + '</td>'
        + '</tr>';
    }).join('');

    container.innerHTML = ''
      + '<div style="font-family:\'Noto Sans SC\',\'Microsoft YaHei\',sans-serif;padding:20px 16px;max-width:720px;margin:0 auto;">'
      +   '<div style="margin-bottom:16px;">'
      +     '<div style="font-size:11px;letter-spacing:2px;font-weight:700;color:#bbb;margin-bottom:6px;">LIVE RANKING</div>'
      +     '<h1 style="font-size:24px;font-weight:700;margin:0;">"海师山盟"预选排行榜</h1>'
      +   '</div>'
      +   '<table style="width:100%;border-collapse:collapse;background:#fff;">'
      +     '<thead>'
      +       '<tr style="background:#f7f7f7;font-size:12px;color:#888;">'
      +         '<th style="padding:10px;text-align:left;font-weight:600;">#</th>'
      +         '<th style="padding:10px;text-align:left;font-weight:600;">选手</th>'
      +         '<th style="padding:10px;text-align:right;font-weight:600;">总分</th>'
      +         '<th style="padding:10px;text-align:right;font-weight:600;">总 DX</th>'
      +       '</tr>'
      +     '</thead>'
      +     '<tbody>' + rows + '</tbody>'
      +   '</table>'
      +   '<div style="margin-top:12px;font-size:12px;color:#aaa;text-align:right;">'
      +     '共 ' + items.length + ' 位选手 · 更新于 ' + (updatedAt ? new Date(updatedAt).toLocaleString('zh-CN') : '-')
      +   '</div>'
      + '</div>';
  }
</script>
